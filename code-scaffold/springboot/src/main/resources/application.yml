server:
  port: 9999
  tomcat:
    max-connections: 30000

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bil_mall?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

ip: localhost

cors:
  # 跨域来源白名单：生产环境必须通过环境变量/启动参数覆盖为正式域名
  # 例：--cors.allowed-origins=https://mall.example.com 或 CORS_ORIGINS 环境变量（逗号分隔）
  allowed-origins: ${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

jwt:
  # 全局签名密钥：三种角色（ADMIN / USER / MERCHANT）共用，角色写在 token 的 role 声明里
  # 生产环境请通过环境变量覆盖：--jwt.secret=xxx 或 JWT_SECRET 环境变量
  secret: ${JWT_SECRET:bil-mall-jwt-secret-2026-please-change}
  expire-hours: 24
